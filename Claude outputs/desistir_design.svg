  <rect width="1120" height="760" fill="url(#cena)"/>

  <!-- ===================== ESTADO 1: bloqueado ===================== -->
  <text x="40" y="44" fill="#6f7c8d" font-size="15" letter-spacing="1.5">1 · PRIMEIROS 15 SEGUNDOS — TRAVADO</text>
  <g opacity="0.55">
