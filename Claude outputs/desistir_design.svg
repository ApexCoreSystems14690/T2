      <stop offset="0" stop-color="#11151b"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <clipPath id="trilha1"><rect x="330" y="176" width="460" height="14" rx="3"/></clipPath>
    <clipPath id="trilha2"><rect x="330" y="410" width="460" height="14" rx="3"/></clipPath>
    <clipPath id="trilha3"><rect x="330" y="644" width="460" height="14" rx="3"/></clipPath>
