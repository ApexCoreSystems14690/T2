  <text x="330" y="384" fill="#8c98a8" font-size="14">Ainda d&#225; pra te salvarem — mas sobra s&#243; 1:30.</text>
  <rect x="330" y="410" width="460" height="14" rx="3" fill="#000" opacity="0.45"/>
  <rect x="330" y="410" width="460" height="14" rx="3" fill="none" stroke="#ffaa00" stroke-opacity="0.35" stroke-width="1"/>
  <text x="560" y="421" fill="#c9d3df" font-size="12" text-anchor="middle" letter-spacing="1">SEGURE</text>
  <rect x="300" y="432" width="520" height="4" fill="#ffaa00"/>

  <!-- ===================== ESTADO 3: enchendo ===================== -->
  <text x="40" y="512" fill="#6f7c8d" font-size="15" letter-spacing="1.5">3 · SEGURANDO — A BARRA ENCHE EM 1,5s</text>
  <rect x="300" y="530" width="520" height="140" rx="4" fill="#000" opacity="0.6"/>
  <text x="330" y="568" fill="#ffaa00" font-size="21" font-weight="700" letter-spacing="0.5">DESISTIR</text>
