  <rect x="330" y="644" width="460" height="14" rx="3" fill="none" stroke="#ffaa00" stroke-opacity="0.5" stroke-width="1"/>
  <rect x="300" y="666" width="520" height="4" fill="#ffaa00"/>

  <!-- legenda -->
  <g font-size="13" fill="#6f7c8d">
    <text x="860" y="100">painel preto 60%,</text>
    <text x="860" y="118">canto 4 — igual ao</text>
    <text x="860" y="136">Porte de armas</text>

