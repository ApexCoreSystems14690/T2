  <text x="40" y="728" fill="#4d5866" font-size="13">cor do tema do jogador (padr&#227;o 255,170,0) &#183; SourceSansBold no t&#237;tulo &#183; tudo em Scale &#183; rodap&#233; da tela de morte</text>
