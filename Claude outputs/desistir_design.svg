    <text x="330" y="150" fill="#8c98a8" font-size="14">Ainda d&#225; pra te salvarem — mas sobra s&#243; 1:30.</text>
    <rect x="330" y="176" width="460" height="14" rx="3" fill="#000" opacity="0.45"/>
    <text x="560" y="187" fill="#7d8a9a" font-size="12" text-anchor="middle" letter-spacing="1">DISPON&#205;VEL EM 9s</text>
    <rect x="300" y="198" width="520" height="4" fill="#ffaa00" opacity="0.35"/>
  </g>

  <!-- ===================== ESTADO 2: pronto ===================== -->
  <text x="40" y="278" fill="#6f7c8d" font-size="15" letter-spacing="1.5">2 · LIBERADO — SEGURE</text>
