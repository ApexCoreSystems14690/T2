<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="980" height="660" fill="#1d1d1d"/>

  <text x="24" y="38" fill="#e8e8e8" font-size="21" font-weight="600">Onde fica cada coisa no Blender</text>
  <text x="24" y="60" fill="#8a8a8a" font-size="13">as 4 áreas que você vai usar pra animar</text>

  <!-- VIEWPORT -->
  <rect x="24" y="80" width="600" height="330" rx="6" fill="#303030" stroke="#4a4a4a"/>
  <text x="40" y="106" fill="#cfcfcf" font-size="14" font-weight="600">1 · VIEWPORT 3D</text>
  <text x="40" y="130" fill="#9d9d9d" font-size="12.5">onde você move as coisas</text>
  <rect x="40" y="146" width="290" height="26" rx="4" fill="#3d4a5c"/>
  <text x="50" y="164" fill="#dbe7f5" font-size="12.5">Ctrl+Alt+Numpad0 = vira câmera pro seu ângulo</text>
  <rect x="40" y="178" width="290" height="26" rx="4" fill="#3d4a5c"/>
  <text x="50" y="196" fill="#dbe7f5" font-size="12.5">Numpad0 = entra / sai da visão da câmera</text>
  <rect x="40" y="210" width="290" height="26" rx="4" fill="#5c4a3d"/>
  <text x="50" y="228" fill="#f5e7db" font-size="12.5">G move · R gira · S escala</text>
  <rect x="40" y="242" width="290" height="26" rx="4" fill="#4a5c3d"/>
  <text x="50" y="260" fill="#e7f5db" font-size="12.5">I = crava keyframe (o botão mais importante)</text>
  <text x="40" y="296" fill="#9d9d9d" font-size="12.5">View › Viewport Render Animation</text>
  <text x="40" y="314" fill="#6f6f6f" font-size="12">= prévia rápida, sem render bonito</text>
  <text x="40" y="344" fill="#9d9d9d" font-size="12.5">Barra de espaço = dá play</text>

  <!-- PROPERTIES -->
  <rect x="640" y="80" width="316" height="330" rx="6" fill="#303030" stroke="#4a4a4a"/>
  <text x="656" y="106" fill="#cfcfcf" font-size="14" font-weight="600">2 · PROPRIEDADES (direita)</text>
  <text x="656" y="132" fill="#9d9d9d" font-size="12.5">ícone de impressora = Output</text>
  <text x="656" y="150" fill="#6f6f6f" font-size="12">Frame Start / End · FPS · Resolution</text>
  <text x="656" y="168" fill="#6f6f6f" font-size="12">Output = pasta · Format = FFmpeg Video</text>
  <text x="656" y="186" fill="#6f6f6f" font-size="12">Encoding: MPEG-4 + H.264</text>
  <text x="656" y="216" fill="#9d9d9d" font-size="12.5">ícone de câmera de trás = Render</text>
  <text x="656" y="234" fill="#6f6f6f" font-size="12">motor, amostras, Motion Blur</text>
  <text x="656" y="264" fill="#9d9d9d" font-size="12.5">ícone de chave inglesa = Modifiers</text>
  <text x="656" y="294" fill="#9d9d9d" font-size="12.5">ícone de câmera verde = dados da lente</text>
  <text x="656" y="312" fill="#6f6f6f" font-size="12">Focal Length · Sensor · Depth of Field</text>
  <rect x="656" y="334" width="284" height="44" rx="4" fill="#5c3d3d"/>
  <text x="666" y="352" fill="#f5dbdb" font-size="12">Sensor do viewport = 72mm.</text>
  <text x="666" y="368" fill="#f5dbdb" font-size="12">Na câmera é 36mm — por isso fecha o quadro.</text>

  <!-- TIMELINE -->
  <rect x="24" y="428" width="932" height="200" rx="6" fill="#303030" stroke="#4a4a4a"/>
  <text x="40" y="454" fill="#cfcfcf" font-size="14" font-weight="600">3 · LINHA DO TEMPO (embaixo)</text>

  <line x1="40" y1="500" x2="900" y2="500" stroke="#555" stroke-width="2"/>
  <g fill="#e0a03a">
    <rect x="52" y="492" width="11" height="16" rx="2" transform="rotate(45 57 500)"/>
    <rect x="252" y="492" width="11" height="16" rx="2" transform="rotate(45 257 500)"/>
    <rect x="452" y="492" width="11" height="16" rx="2" transform="rotate(45 457 500)"/>
    <rect x="712" y="492" width="11" height="16" rx="2" transform="rotate(45 717 500)"/>
    <rect x="884" y="492" width="11" height="16" rx="2" transform="rotate(45 889 500)"/>
  </g>
  <text x="44" y="528" fill="#9d9d9d" font-size="11.5">1</text>
  <text x="244" y="528" fill="#9d9d9d" font-size="11.5">55</text>
  <text x="444" y="528" fill="#9d9d9d" font-size="11.5">100</text>
  <text x="702" y="528" fill="#9d9d9d" font-size="11.5">165</text>
  <text x="876" y="528" fill="#9d9d9d" font-size="11.5">192</text>

  <text x="44" y="548" fill="#c7c7c7" font-size="12">carro fora</text>
  <text x="228" y="548" fill="#c7c7c7" font-size="12">entra no quadro</text>
  <text x="428" y="548" fill="#c7c7c7" font-size="12">passa raspando</text>
  <text x="676" y="548" fill="#c7c7c7" font-size="12">começa a frear</text>
  <text x="852" y="548" fill="#c7c7c7" font-size="12">parado</text>

  <text x="40" y="582" fill="#9d9d9d" font-size="12.5">Cada losango laranja é um keyframe. Blender preenche o meio sozinho.</text>
  <rect x="40" y="594" width="232" height="24" rx="4" fill="#4a5c3d"/>
  <text x="50" y="611" fill="#e7f5db" font-size="12.5">Botão do bonequinho = Auto Key</text>
  <text x="290" y="611" fill="#6f6f6f" font-size="12">ligado, todo movimento vira keyframe sozinho</text>
</svg>
