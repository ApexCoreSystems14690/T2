<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Brasão do Governo de Santa Fé" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- [23/10] Brasão original do Governo de Santa Fé (capinha da corporação) -->
  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D365"/><stop offset="1" stop-color="#C9961A"/>
    </linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A54B8"/><stop offset="1" stop-color="#14306F"/>
    </linearGradient>
  </defs>
  <!-- louros -->
  <g fill="#2E7D32" stroke="#1B5E20" stroke-width="1">
    <g id="ramo">
      <path d="M46 168 C24 140 20 104 30 72" fill="none" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="30" cy="80" rx="6" ry="13" transform="rotate(-20 30 80)"/>
      <ellipse cx="26" cy="102" rx="6" ry="13" transform="rotate(-10 26 102)"/>
      <ellipse cx="28" cy="124" rx="6" ry="13" transform="rotate(5 28 124)"/>
      <ellipse cx="36" cy="146" rx="6" ry="13" transform="rotate(25 36 146)"/>
      <ellipse cx="42" cy="90" rx="5" ry="11" transform="rotate(35 42 90)"/>
      <ellipse cx="40" cy="114" rx="5" ry="11" transform="rotate(40 40 114)"/>
      <ellipse cx="46" cy="138" rx="5" ry="11" transform="rotate(50 46 138)"/>
    </g>
    <use href="#ramo" transform="translate(200 0) scale(-1 1)"/>
  </g>
  <!-- escudo -->
  <path d="M100 18 L158 36 V96 C158 136 132 160 100 176 C68 160 42 136 42 96 V36 Z" fill="url(#ouro)"/>
  <path d="M100 26 L150 42 V96 C150 131 128 152 100 167 C72 152 50 131 50 96 V42 Z" fill="url(#azul)"/>
  <!-- estrela -->
  <path d="M100 38 l4.7 9.6 10.6 1.5-7.7 7.4 1.8 10.5-9.4-5-9.4 5 1.8-10.5-7.7-7.4 10.6-1.5z" fill="url(#ouro)"/>
  <!-- palácio do governo -->
  <g fill="#F4F1E6">
    <path d="M64 88 L100 72 L136 88 Z"/>
    <rect x="64" y="90" width="72" height="5"/>
    <rect x="69" y="97" width="7" height="30"/><rect x="83" y="97" width="7" height="30"/>
    <rect x="110" y="97" width="7" height="30"/><rect x="124" y="97" width="7" height="30"/>
    <rect x="94" y="104" width="12" height="23" rx="6" ry="6"/>
    <rect x="60" y="129" width="80" height="5"/>
    <rect x="56" y="136" width="88" height="5"/>
  </g>
  <!-- faixa -->
  <path d="M30 156 Q100 176 170 156 L176 176 Q100 196 24 176 Z" fill="#1D3F94" stroke="url(#ouro)" stroke-width="3"/>
  <text x="100" y="180" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-weight="800" font-size="15" letter-spacing="2" fill="#F6D365">SANTA FÉ</text>
</svg>
